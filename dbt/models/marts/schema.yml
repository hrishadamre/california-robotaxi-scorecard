version: 2

models:
  - name: dim_county
    description: California counties in the service footprint (from the ca_counties seed).
    columns:
      - name: county_fips
        description: Five-digit county code, kept as text so the leading zero survives.
        tests:
          - unique
          - not_null

  - name: fact_service_month
    description: Monthly service totals per company, program and mode (trips, miles, passengers).
    tests:
      - unique_grain:
          arguments:
            columns: [company, program, mode, month_start]
    columns:
      - name: quarter
        tests: [not_null]
      - name: month_start
        tests: [not_null]
      - name: company
        tests: [not_null]

  - name: fact_trip_outcome_q
    description: Ride requests per quarter by outcome and reason (one row = a distinct combination, requests = count).
    tests:
      - unique_grain:
          arguments:
            columns: [quarter, company, program, mode, fulfilled, reason_unfulfilled, wav_requested, shared, fared]
    columns:
      - name: quarter
        tests: [not_null]
      - name: company
        tests: [not_null]
      - name: fulfilled
        description: Y = completed, N = not completed, REDACTED = hidden by the filer.
        tests:
          - accepted_values:
              arguments:
                values: ["Y", "N", "REDACTED"]

  - name: fact_incident_q
    description: Collisions and complaints per quarter, counted from Y flags (never from row counts).
    tests:
      - unique_grain:
          arguments:
            columns: [quarter, company, program, mode]
    columns:
      - name: quarter
        tests: [not_null]
      - name: company
        tests: [not_null]

  - name: fact_tract_q
    description: Collisions by census tract and quarter.
    tests:
      - unique_grain:
          arguments:
            columns: [quarter, company, program, mode, tract]
    columns:
      - name: company
        tests: [not_null]
      - name: county_fips
        description: First five digits of the tract code.
        tests:
          - relationships:
              arguments:
                to: ref('dim_county')
                field: county_fips
              config:
                severity: warn

  - name: fact_service_area_m
    description: Census tracts in service each month.
    tests:
      - unique_grain:
          arguments:
            columns: [company, program, mode, month_start, tract]
    columns:
      - name: company
        tests: [not_null]

  - name: fact_pilot_metrics_q
    description: Free-pilot program metrics in long format (one row per metric).
    tests:
      - unique_grain:
          arguments:
            columns: [quarter, company, mode, metric]
    columns:
      - name: company
        tests: [not_null]

  - name: fact_federal_crash_m
    description: Federal crash reports from the Waymo Safety Impact hub, counted per month. Street text and ZIP codes are excluded on purpose.
    tests:
      - unique_grain:
          arguments:
            columns: [month_start, state, county, road_type, crash_type, sgo_rule_version]

  - name: fact_benchmark
    description: Waymo vs human-driver benchmark. pct_difference holds reductions as negative numbers.
    tests:
      - unique_grain:
          arguments:
            columns: [outcome, benchmark_version, area, grouping_type, crash_group]

  - name: fact_rider_only_miles
    description: Rider-only miles by area, in millions.
    columns:
      - name: area
        tests: [unique]