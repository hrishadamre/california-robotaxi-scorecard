version: 2

sources:
  - name: cpuc_model
    schema: main
    description: Tables built by the original Python step 03. Kept for the old-vs-new parity check.
    tables:
      - name: fact_trip_outcome_q
        columns:
          - name: fulfilled
            tests:
              - accepted_values:
                  arguments:
                    values: ["Y", "N", "REDACTED"]
      - name: fact_incident_q
      - name: fact_service_month
      - name: fact_tract_q
        columns:
          - name: county_fips
            tests:
              - relationships:
                  arguments:
                    to: ref('dim_county')
                    field: county_fips
                  config:
                    severity: warn

  - name: landed
    schema: main
    description: Raw files landed as text by step03a, with standard column names.
    tables:
      - name: raw_month
      - name: raw_trips
      - name: raw_incidents
      - name: raw_incident_tract
      - name: raw_service_area
      - name: raw_pilot_month
      - name: raw_pilot_metrics
      - name: raw_waymo_federal
      - name: raw_waymo_benchmark
      - name: raw_waymo_rider_miles
      - name: raw_manifest
